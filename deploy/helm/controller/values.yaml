# Default values for oke-gateway-api-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Override the namespace where the controller will be deployed.
# If not set, it defaults to the release namespace.

nameOverride: ""
fullnameOverride: ""

reconcile:
  # Periodic OCI drift reconciliation interval. Use 0s to disable.
  drift-interval: 0s

ociapi:
  # Maximum concurrent OCI SDK HTTP requests per OCI service client.
  # Use -1 to disable controller-side request limiting.
  max-concurrent-requests: 4
  # Maximum concurrent mutating OCI SDK HTTP requests per OCI service client.
  # Use -1 to disable the mutating request limit.
  max-concurrent-mutating-requests: 1
  retry:
    # Enable OCI SDK retries for throttling, transient 5xx, and eventual consistency.
    enabled: true
    # Maximum attempts per OCI API operation.
    max-attempts: 8
    # Maximum backoff sleep between retry attempts.
    max-sleep: 30s

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# Deployment configuration
deployment:
  # Specifies whether the controller deployment resources should be installed
  enabled: true

  image:
    repository: ghcr.io/gemyago/oke-gateway-api-controller
    pullPolicy: IfNotPresent
    tag: "" # AppVersion is used by default

  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

  # Node selector, tolerations, and affinity settings can be added here if needed.
  nodeSelector: {}
  tolerations: []
  affinity: {}
